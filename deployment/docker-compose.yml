# TradeQuorum stack
#
#   cd deployment && cp .env.example .env   # fill in secrets
#   docker compose up -d --build                       # paper simulator + Yahoo data
#   docker compose --profile ibkr up -d --build        # + Interactive Brokers paper gateway
#
# Only nginx (port 80/443) is published. Postgres, Redis and the IB API port
# stay on the private docker network.

services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: trading-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: trading
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: trading-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Interactive Brokers Gateway (paper). Start with: docker compose --profile ibkr up -d
  # Image docs: https://github.com/gnzsnz/ib-gateway-docker
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    container_name: trading-ib-gateway
    profiles: ["ibkr"]
    restart: unless-stopped
    environment:
      TWS_USERID: ${TWS_USERID:?set TWS_USERID in .env}
      TWS_PASSWORD: ${TWS_PASSWORD:?set TWS_PASSWORD in .env}
      TRADING_MODE: ${TRADING_MODE:-paper}
      READ_ONLY_API: ${IBKR_READONLY_API:-no}
      TWOFA_TIMEOUT_ACTION: restart
      RELOGIN_AFTER_TWOFA_TIMEOUT: "yes"
      EXISTING_SESSION_DETECTED_ACTION: primary
      AUTO_RESTART_TIME: "11:59 PM"
      TIME_ZONE: ${TIME_ZONE:-Etc/UTC}
      VNC_SERVER_PASSWORD: ${VNC_SERVER_PASSWORD:-}
    # Uncomment to watch the gateway login over VNC through an SSH tunnel
    # ports:
    #   - "127.0.0.1:5900:5900"

  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
    container_name: trading-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://trading:${POSTGRES_PASSWORD}@postgres:5432/trading
      REDIS_URL: redis://redis:6379/0
      # Broker: "paper" (simulator) or "ibkr" (needs the ib-gateway profile)
      BROKER: ${BROKER:-paper}
      IBKR_HOST: ${IBKR_HOST:-ib-gateway}
      IBKR_PORT: ${IBKR_PORT:-4004}   # gateway container: 4004 = paper, 4003 = live
      DEFAULT_DATA_SOURCE: ${DEFAULT_DATA_SOURCE:-yahoo}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # nginx serving the built dashboard + reverse proxy to the API
  web:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_WS_URL: ${VITE_WS_URL:-/ws}
    container_name: trading-web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: trading-network
