version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: trading-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trading_secure_password}
      POSTGRES_DB: trading
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and pub/sub
  redis:
    image: redis:7-alpine
    container_name: trading-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: trading-backend
    restart: unless-stopped
    environment:
      # Database
      - DATABASE_URL=postgresql+asyncpg://trading:${POSTGRES_PASSWORD:-trading_secure_password}@postgres:5432/trading
      # Redis
      - REDIS_URL=redis://redis:6379/0
      # JWT
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-this-in-production}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-30}
      # AWS (Bedrock + SageMaker)
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - BEDROCK_MODEL_ID=${BEDROCK_MODEL_ID:-anthropic.claude-opus-4-5-20250514}
      - SAGEMAKER_ENDPOINT=${SAGEMAKER_ENDPOINT:-ai-trading-pattern-recognition}
      # MT5/Exness
      - MT5_LOGIN=${MT5_LOGIN}
      - MT5_PASSWORD=${MT5_PASSWORD}
      - MT5_SERVER=${MT5_SERVER:-Exness-MT5Real}
      # News APIs
      - REUTERS_API_KEY=${REUTERS_API_KEY}
      - BLOOMBERG_API_KEY=${BLOOMBERG_API_KEY}
      - TWITTER_API_KEY=${TWITTER_API_KEY}
      - TWITTER_API_SECRET=${TWITTER_API_SECRET}
      - TWITTER_BEARER_TOKEN=${TWITTER_BEARER_TOKEN}
      - SEC_EDGAR_USER_AGENT=${SEC_EDGAR_USER_AGENT:-AI-Trading-System contact@example.com}
      - NEWSAPI_KEY=${NEWSAPI_KEY}
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
      - POLYGON_API_KEY=${POLYGON_API_KEY}
      # Risk Limits
      - MAX_POSITION_PCT=${MAX_POSITION_PCT:-0.05}
      - MAX_PORTFOLIO_RISK_PCT=${MAX_PORTFOLIO_RISK_PCT:-0.02}
      - MAX_CORRELATED_EXPOSURE=${MAX_CORRELATED_EXPOSURE:-0.20}
      - MAX_DAILY_LOSS_PCT=${MAX_DAILY_LOSS_PCT:-0.05}
      - MAX_OPEN_POSITIONS=${MAX_OPEN_POSITIONS:-10}
      # Trading
      - TRADING_SYMBOLS=${TRADING_SYMBOLS:-BTCUSD,ETHUSD,XAUUSD,EURUSD,GBPUSD}
      # Scheduler
      - NEWS_SCRAPE_INTERVAL_MINUTES=${NEWS_SCRAPE_INTERVAL_MINUTES:-5}
      - TECHNICAL_ANALYSIS_INTERVAL_MINUTES=${TECHNICAL_ANALYSIS_INTERVAL_MINUTES:-1}
      # Encryption & Admin
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      # Debug
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ../src:/app/src:ro  # Mount existing source code
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # React Dashboard (built and served by Nginx)
  frontend:
    build:
      context: ../dashboard
      dockerfile: ../deployment/Dockerfile.frontend
    container_name: trading-frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost/api
      - VITE_WS_URL=ws://localhost/ws
    volumes:
      - frontend_build:/app/dist

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: trading-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - frontend_build:/usr/share/nginx/html:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro  # For SSL certificates
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  frontend_build:

networks:
  default:
    name: trading-network
